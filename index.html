<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2d3cf">
  <title>Five Men and a Fallen Heiress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="icon-maps" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3ZM9 3v15m6-12v15"/></symbol>
    <symbol id="icon-instapic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-14 4h3m4 0h3m-10 3h3"/></symbol>
    <symbol id="icon-photos" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
    <symbol id="icon-notes" viewBox="0 0 24 24"><path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9M8 10h3m-3 5h5m1-7 5-5 2 2-5 5-3 1Z"/></symbol>
    <symbol id="icon-reminderz" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m6 8 1 1 2-2m-3 7 1 1 2-2m3-5h6m-6 6h6m-6 4h6"/></symbol>
  </svg>
  <div class="site-shell is-home">
    <div class="status-bar" aria-label="Phone status">
      <span id="status-time">9:41</span>
      <span class="phone-camera" aria-hidden="true"></span>
      <span class="status-indicators" aria-hidden="true">
        <svg viewBox="0 0 24 16"><path d="M2 14V11m5 3V8m5 6V5m5 9V2"/></svg>
        <svg viewBox="0 0 24 18"><path d="M3 5a15 15 0 0 1 18 0M6 9a10 10 0 0 1 12 0m-9 4a5 5 0 0 1 6 0"/><circle cx="12" cy="16" r="1"/></svg>
        <span class="battery"></span>
      </span>
    </div>
    <header class="app-toolbar" hidden>
      <button class="home-back" type="button" data-page="home" aria-label="Back to home screen">‹ <span>Home</span></button>
      <h1 id="app-title">Maps</h1>
      <svg class="toolbar-icon" aria-hidden="true"><use id="toolbar-symbol" href="#icon-maps"/></svg>
    </header>

    <main id="app" class="content" tabindex="-1" aria-label="Home screen"></main>

    <nav class="phone-dock" aria-label="Favorite apps">
      <button class="dock-app" type="button" data-page="maps" aria-label="Open Maps"><span class="app-icon icon-maps"><svg aria-hidden="true"><use href="#icon-maps"/></svg></span></button>
      <button class="dock-app" type="button" data-page="instapic" aria-label="Open InstaPic"><span class="app-icon icon-instapic"><svg aria-hidden="true"><use href="#icon-instapic"/></svg></span></button>
      <button class="dock-app" type="button" data-page="notes" aria-label="Open Notes"><span class="app-icon icon-notes"><svg aria-hidden="true"><use href="#icon-notes"/></svg></span></button>
    </nav>
    <button class="home-indicator" type="button" data-page="home" aria-label="Return to home screen"><span></span></button>
  </div>
  <script src="script.js"></script>
</body>
</html>
